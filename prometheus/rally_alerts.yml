# ==============================================================================
# Prometheus Alert Rules for Rally OpenStack Monitor
# ==============================================================================
# Add this file to your existing Prometheus alerting rules configuration.
# In prometheus.yml, add under rule_files:
#   - "rally_alerts.yml"

groups:
  - name: rally_cleanup
    rules:
      # -----------------------------------------------------------------------
      # SCENARIO CLEANUP FAILURE - Critical: s_rally_* resources left behind
      # Scenario cleanup runs during the test itself; orphans here mean
      # something went wrong mid-scenario, not just in teardown.
      # -----------------------------------------------------------------------
      - alert: RallyCleanupFailure
        expr: rally_cleanup_failure == 1
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Rally scenario cleanup failed for {{ $labels.service }}"
          description: |
            Scenario-created (s_rally_*) orphaned resources detected for
            {{ $labels.service }}. These are left by scenario plugins that
            failed to clean up mid-test — not just context teardown.
            Immediate action required to prevent resource leaks.
          runbook: &purge_runbook |
            Preview first (dry run, deletes nothing):
              docker exec -u rally rally-monitor /scripts/purge_orphans.sh
            Then, once the listed resources are confirmed Rally-owned:
              docker exec -u rally rally-monitor /scripts/purge_orphans.sh --confirm

      # -----------------------------------------------------------------------
      # ORPHANED RESOURCE COUNT - Warning when s_rally_* resources accumulate
      # -----------------------------------------------------------------------
      - alert: RallyOrphanedResourcesHigh
        expr: rally_orphaned_resources > 5
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High scenario orphan count: {{ $labels.service }}/{{ $labels.resource_type }}"
          description: |
            {{ $value }} scenario-created (s_rally_*) orphaned resources
            detected for {{ $labels.service }} ({{ $labels.resource_type }}).
            These resources may need manual cleanup.
          runbook: *purge_runbook

      # -----------------------------------------------------------------------
      # CONTEXT CLEANUP WARNING - Info: c_rally_* resources left behind
      # Context cleanup runs after the task completes and its failure does not
      # mark the task as failed. Orphaned c_rally_* resources on an otherwise
      # successful run are a low-severity housekeeping concern.
      # -----------------------------------------------------------------------
      - alert: RallyContextCleanupWarning
        expr: rally_context_cleanup_warning == 1
        for: 15m
        labels:
          severity: info
          team: infra
        annotations:
          summary: "Rally context teardown left resources for {{ $labels.service }}"
          description: |
            Context-created (c_rally_*) orphaned resources detected for
            {{ $labels.service }}. The test run itself succeeded; Rally's
            context teardown (projects, users, networks) did not complete
            cleanly. Monitor for accumulation across runs.
          runbook: &purge_dry_run_runbook "docker exec -u rally rally-monitor /scripts/purge_orphans.sh  (dry run; add --confirm only after reviewing the list)"

      # -----------------------------------------------------------------------
      # RGW ORPHANS - Warning: orphaned implicit-tenant users/buckets in Ceph
      # -----------------------------------------------------------------------
      - alert: RallyRgwOrphanedUsers
        expr: rally_rgw_orphaned_users > 0
        for: 30m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally RGW orphaned users detected"
          description: |
            {{ $value }} orphaned RGW implicit-tenant user(s) are present.
            These users outlived their Keystone project teardown and may leak
            Swift data in Ceph.
          runbook: *purge_dry_run_runbook

      - alert: RallyRgwOrphanedBuckets
        expr: rally_rgw_orphaned_buckets > 5
        for: 30m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally RGW orphaned buckets detected"
          description: |
            {{ $value }} bucket(s) are owned by orphaned RGW implicit-tenant
            users. Verify Rally cleanup and purge Rally-owned RGW orphans when safe.
          runbook: *purge_dry_run_runbook

      - alert: RallyRgwScanDegraded
        expr: rally_rgw_scan_ok == 0
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally RGW orphan scan degraded"
          description: |
            RGW orphan detection is reporting an error state. Check RGW admin API
            credentials, network reachability, and Keystone lookups before relying
            on zero-orphan readings.
          runbook: "docker logs rally-monitor"

      # A failed OpenStack orphan listing reads as 0 orphans for that type, so
      # RallyCleanupFailure/RallyContextCleanupWarning go silent exactly when
      # the scan is blind. This surfaces the blindness instead.
      - alert: RallyCleanupScanDegraded
        expr: rally_cleanup_scan_ok == 0
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally orphan scan could not list some OpenStack resources"
          description: |
            At least one OpenStack list call in the last cleanup scan failed or
            returned unparseable output (see openstack_scan_errors in
            cleanup_metrics.json). Orphan counts for those resource types read
            as 0 and cannot be trusted until a scan succeeds.
          runbook: "docker logs rally-monitor"

  - name: rally_tests
    rules:
      # -----------------------------------------------------------------------
      # TEST FAILURES - Warning: a Rally scenario failed
      # -----------------------------------------------------------------------
      # Maintenance inhibition (opt-in): suppress this alert while an operator
      # has posted a maintenance-type announcement (see scripts/announce.sh).
      # rally_maintenance_mode carries only the scrape labels (job, instance),
      # so the `unless` matches on(job, instance) -- the same reason the
      # rally_data_valid guard does: a bare `and`/`unless` compares ALL labels,
      # and service/scenario never match. Enable when planned maintenance
      # routinely trips expected failures and you want one operator action to
      # silence both the dashboard banner and the alert:
      #   expr: rally_task_success == 0 and on(job, instance) rally_data_valid == 1 unless on(job, instance) rally_maintenance_mode == 1
      - alert: RallyTestFailure
        expr: rally_task_success == 0 and on(job, instance) rally_data_valid == 1
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally test failed: {{ $labels.service }}/{{ $labels.scenario }}"
          description: |
            The Rally scenario {{ $labels.scenario }} for service
            {{ $labels.service }} has failed. This may indicate an issue
            with the OpenStack cloud.
          # Shared with RallyServiceDown, RallySLABreach and RallyOverallFailure
          # through this YAML anchor.
          runbook: &rally_test_runbook |
            Open the dashboard service card for the first error and the
            "Full Rally report". Raw output: /results/<RUN>/run.log and
            /results/<RUN>/<service>.log inside the container, e.g.
              docker exec rally-monitor sh -c 'tail -50 /results/$(ls /results | grep -E "^[0-9]{8}T[0-9]{6}Z$" | tail -1)/run.log'
            Re-run on demand: docker exec -u rally rally-monitor /scripts/run_tests.sh

      # -----------------------------------------------------------------------
      # SERVICE DOWN - Critical: entire service is failing
      # -----------------------------------------------------------------------
      # Maintenance inhibition (opt-in): suppress while a maintenance-type
      # announcement is active. on(job, instance) matches rally_maintenance_mode
      # (scrape labels only) against this rule's labeled series. Enable to silence expected service-wide
      # failures during planned maintenance windows:
      #   expr: rally_service_status == 0 and on(job, instance) rally_data_valid == 1 unless on(job, instance) rally_maintenance_mode == 1
      - alert: RallyServiceDown
        expr: rally_service_status == 0 and on(job, instance) rally_data_valid == 1
        for: 10m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "OpenStack service failing Rally tests: {{ $labels.service }}"
          description: |
            Rally reports the {{ $labels.service }} service as failed: a
            scenario failed, an SLA was breached, or its task never started.
            This may indicate a service outage or major degradation.
          runbook: *rally_test_runbook

      # -----------------------------------------------------------------------
      # SLA BREACH - Warning: SLA criteria not met
      # -----------------------------------------------------------------------
      # Maintenance inhibition (opt-in): suppress while a maintenance-type
      # announcement is active. on(job, instance) matches rally_maintenance_mode
      # (scrape labels only) against this rule's labeled series. Enable to avoid SLA-breach noise from
      # degraded performance during planned maintenance:
      #   expr: rally_task_sla_passed == 0 and on(job, instance) rally_data_valid == 1 unless on(job, instance) rally_maintenance_mode == 1
      - alert: RallySLABreach
        expr: rally_task_sla_passed == 0 and on(job, instance) rally_data_valid == 1
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally SLA breach: {{ $labels.service }}/{{ $labels.scenario }}"
          description: |
            The SLA criteria for {{ $labels.scenario }} ({{ $labels.service }})
            have not been met. Check for performance degradation.
          runbook: *rally_test_runbook

  - name: rally_data
    rules:
      # -----------------------------------------------------------------------
      # DATA INVALID - Warning: exporter has no valid result data
      # Fires when rally_data_valid is 0, meaning the summary file is missing,
      # corrupt, or still at its initial "waiting_for_first_run" seed value.
      # -----------------------------------------------------------------------
      - alert: RallyDataInvalid
        expr: rally_data_valid == 0
        for: 30m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally exporter has no valid test result data"
          description: |
            The rally_data_valid metric has been 0 for over 30 minutes,
            meaning the exporter cannot read a valid latest_summary.json.
            The file may be missing, corrupt, or awaiting the first test run.
            Check container logs: docker logs rally-monitor

  - name: rally_staleness
    rules:
      # -----------------------------------------------------------------------
      # STALE RESULTS - Warning: tests haven't run recently
      # Measured from when the last run FINISHED (rally_last_run_end_timestamp =
      # start + rally_run_duration_seconds). rally_schedule_interval_seconds is
      # RALLY_SCHEDULE_INTERVAL as cron actually spaces it. The next run starts
      # at the first cron tick after the last one ends (ticks during a run are
      # skipped by the run flock), so it finishes within one interval plus its
      # own duration. Allowing two intervals plus the last run's duration (8h
      # plus run time at the 240m default) fires only when a run takes over an
      # interval longer than the previous one, or none starts at all -- also
      # when runs routinely outlast the interval.
      # `rally_last_run_end_timestamp > 0` skips a fresh container that has not
      # finished its first run (RallyDataInvalid covers that).
      # -----------------------------------------------------------------------
      - alert: RallyStaleResults
        expr: >-
          (time() - rally_last_run_end_timestamp)
            > 2 * rally_schedule_interval_seconds + rally_run_duration_seconds
          and rally_last_run_end_timestamp > 0
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally test results are stale"
          description: |
            No Rally run has finished for over two scheduled intervals plus
            the last run's duration (last run finished
            {{ $value | humanizeDuration }} ago).
            The test runner may be stuck or cron may have stopped.
          runbook: |
            docker exec rally-monitor cat /results/run_state.json   (a run still "running"?)
            docker exec rally-monitor tail -50 /rally/logs/rally-tests.log
            Re-run on demand: docker exec -u rally rally-monitor /scripts/run_tests.sh

      # -----------------------------------------------------------------------
      # RUN SETUP FAILED - Critical: the last run aborted before any test
      # The summary carries a top-level error, so there are no per-service
      # results and RallyServiceDown/RallyTestFailure cannot fire. The error
      # field says which setup step failed: deployment_setup_failed (Keystone
      # auth or OS_AUTH_URL reachability; see deployment.log) or
      # task_args_write_failed (the run directory is not writable).
      # -----------------------------------------------------------------------
      - alert: RallyRunSetupFailed
        expr: rally_run_setup_ok == 0 and rally_data_valid == 1
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Rally run aborted during setup; no service was tested"
          description: |
            The last Rally run failed before any test ran. The "error" field
            of latest_summary.json names the failed step.
          runbook: |
            docker exec rally-monitor jq '{error, error_detail}' /results/latest_summary.json
            deployment_setup_failed: Keystone rejected the credentials or
              OS_AUTH_URL is unreachable. Read the run's deployment.log:
              docker exec rally-monitor sh -c 'cat /results/$(ls /results | grep -E "^[0-9]{8}T[0-9]{6}Z$" | tail -1)/deployment.log'
              and check OS_AUTH_URL / OS_USERNAME / OS_PROJECT_NAME in .env.
            task_args_write_failed: /results is not writable by the rally user
              (full disk, read-only volume, or ownership); see run.log.
            Then re-run: docker exec -u rally rally-monitor /scripts/run_tests.sh

      # -----------------------------------------------------------------------
      # OVERALL HEALTH - Critical: everything is failing
      # -----------------------------------------------------------------------
      # A run aborted during setup also sets rally_overall_success 0; it is
      # excluded here (per instance -- all three share the scrape labels)
      # because RallyRunSetupFailed reports it with a precise runbook.
      - alert: RallyOverallFailure
        expr: rally_overall_success == 0 and rally_data_valid == 1 unless rally_run_setup_ok == 0
        for: 15m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Rally overall health check failing"
          description: |
            One or more OpenStack services are failing Rally tests.
            Investigate immediately to determine the scope of the issue.
          runbook: *rally_test_runbook

  - name: rally_api
    rules:
      # -----------------------------------------------------------------------
      # API DOWN - Critical: a service's lightweight health check reports down
      # Sourced from health.json (rally_api_up), which refreshes every
      # HEALTH_CHECK_INTERVAL (default 15m) — far faster than the ~4h Rally
      # test cadence. for: 20m requires two consecutive missed checks before
      # firing, so a single transient failure does not page.
      # -----------------------------------------------------------------------
      - alert: RallyApiDown
        expr: rally_api_up == 0
        for: 20m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "OpenStack API health check failing: {{ $labels.service }}"
          description: |
            The lightweight API health check for {{ $labels.service }} has
            reported down for over 20 minutes (two consecutive 15-minute
            checks). This is the fastest available outage signal — investigate
            the service endpoint before waiting on the next Rally run.
          runbook: "docker exec rally-monitor tail -f /rally/logs/health-check.log"

      # -----------------------------------------------------------------------
      # API SIGNAL LOST - Warning: overall reachability is 0
      # rally_api_overall_up fails closed: it is 0 on a real outage AND when the
      # health pipeline is broken/stale (corrupt or missing health.json, or one
      # older than rally_api_stale_after_seconds), in which case the per-service
      # rally_api_up series are absent and cannot fire RallyApiDown. This catch-all covers both a sustained overall
      # outage and a silently-broken health pipeline. Per-service RallyApiDown
      # stays the page-worthy critical; this stays a warning.
      # -----------------------------------------------------------------------
      - alert: RallyApiSignalLost
        expr: rally_api_overall_up == 0
        for: 60m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "OpenStack API overall reachability is down or signal lost"
          description: |
            rally_api_overall_up has been 0 for over 60 minutes. This means
            either a sustained overall API outage OR a broken/stale health
            pipeline (corrupt, missing, or stale health.json), in which case
            the per-service rally_api_up series are absent and RallyApiDown
            cannot fire. Check the health-check log and that health.json is
            being written.
          runbook: "docker exec rally-monitor tail -f /rally/logs/health-check.log"

      # -----------------------------------------------------------------------
      # API HEALTH STALE - Warning: health checks stopped updating health.json
      # Narrower than RallyApiSignalLost: says the pipeline stopped (cron died,
      # a check hung, the volume went read-only), not that the cloud is down.
      # rally_api_stale_after_seconds is the exporter's own staleness cut-off:
      # three check intervals (45m at the 15m default), never less than one
      # interval plus the checker timeout. `> 0` skips a fresh container whose
      # seed health.json has no check time yet.
      # -----------------------------------------------------------------------
      - alert: RallyApiHealthStale
        expr: >-
          (time() - rally_api_last_check_timestamp) > rally_api_stale_after_seconds
          and rally_api_last_check_timestamp > 0
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "OpenStack API health checks have stopped updating"
          description: |
            health.json has not been rewritten for longer than the staleness
            cut-off (last check {{ $value | humanizeDuration }} ago). The
            exporter reports no per-service API status until checks resume.
          runbook: |
            docker exec rally-monitor tail -50 /rally/logs/health-check.log
            docker exec rally-monitor cat /results/health.json
            Run once by hand: docker exec -u rally rally-monitor /scripts/health_check.sh
