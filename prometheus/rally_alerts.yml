# ==============================================================================
# Prometheus Alert Rules for Rally OpenStack Monitor
# ==============================================================================
# Add this file to your existing Prometheus alerting rules configuration.
# In prometheus.yml, add under rule_files:
#   - "rally_alerts.yml"

groups:
  - name: rally_cleanup
    rules:
      # -----------------------------------------------------------------------
      # SCENARIO CLEANUP FAILURE - Critical: s_rally_* resources left behind
      # Scenario cleanup runs during the test itself; orphans here mean
      # something went wrong mid-scenario, not just in teardown.
      # -----------------------------------------------------------------------
      - alert: RallyCleanupFailure
        expr: rally_cleanup_failure == 1
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Rally scenario cleanup failed for {{ $labels.service }}"
          description: |
            Scenario-created (s_rally_*) orphaned resources detected for
            {{ $labels.service }}. These are left by scenario plugins that
            failed to clean up mid-test — not just context teardown.
            Immediate action required to prevent resource leaks.
          runbook: "docker exec rally-monitor /scripts/purge_orphans.sh --confirm"

      # -----------------------------------------------------------------------
      # ORPHANED RESOURCE COUNT - Warning when s_rally_* resources accumulate
      # -----------------------------------------------------------------------
      - alert: RallyOrphanedResourcesHigh
        expr: rally_orphaned_resources > 5
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High scenario orphan count: {{ $labels.service }}/{{ $labels.resource_type }}"
          description: |
            {{ $value }} scenario-created (s_rally_*) orphaned resources
            detected for {{ $labels.service }} ({{ $labels.resource_type }}).
            These resources may need manual cleanup.
          runbook: "docker exec rally-monitor /scripts/purge_orphans.sh --confirm"

      # -----------------------------------------------------------------------
      # CONTEXT CLEANUP WARNING - Info: c_rally_* resources left behind
      # Context cleanup runs after the task completes and its failure does not
      # mark the task as failed. Orphaned c_rally_* resources on an otherwise
      # successful run are a low-severity housekeeping concern.
      # -----------------------------------------------------------------------
      - alert: RallyContextCleanupWarning
        expr: rally_context_cleanup_warning == 1
        for: 15m
        labels:
          severity: info
          team: infra
        annotations:
          summary: "Rally context teardown left resources for {{ $labels.service }}"
          description: |
            Context-created (c_rally_*) orphaned resources detected for
            {{ $labels.service }}. The test run itself succeeded; Rally's
            context teardown (projects, users, networks) did not complete
            cleanly. Monitor for accumulation across runs.
          runbook: "docker exec rally-monitor /scripts/purge_orphans.sh"

      # -----------------------------------------------------------------------
      # RGW ORPHANS - Warning: orphaned implicit-tenant users/buckets in Ceph
      # -----------------------------------------------------------------------
      - alert: RallyRgwOrphanedUsers
        expr: rally_rgw_orphaned_users > 0
        for: 30m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally RGW orphaned users detected"
          description: |
            {{ $value }} orphaned RGW implicit-tenant user(s) are present.
            These users outlived their Keystone project teardown and may leak
            Swift data in Ceph.
          runbook: "docker exec rally-monitor /scripts/purge_orphans.sh"

      - alert: RallyRgwOrphanedBuckets
        expr: rally_rgw_orphaned_buckets > 5
        for: 30m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally RGW orphaned buckets detected"
          description: |
            {{ $value }} bucket(s) are owned by orphaned RGW implicit-tenant
            users. Verify Rally cleanup and purge Rally-owned RGW orphans when safe.
          runbook: "docker exec rally-monitor /scripts/purge_orphans.sh"

      - alert: RallyRgwScanDegraded
        expr: rally_rgw_scan_ok == 0
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally RGW orphan scan degraded"
          description: |
            RGW orphan detection is reporting an error state. Check RGW admin API
            credentials, network reachability, and Keystone lookups before relying
            on zero-orphan readings.
          runbook: "docker logs rally-monitor"

  - name: rally_tests
    rules:
      # -----------------------------------------------------------------------
      # TEST FAILURES - Warning: a Rally scenario failed
      # -----------------------------------------------------------------------
      # Maintenance inhibition (opt-in): suppress this alert while an operator
      # has posted a maintenance-type announcement (see scripts/announce.sh).
      # rally_maintenance_mode has no labels, so the `unless` needs on() to
      # match against the empty label set. Enable when planned maintenance
      # routinely trips expected failures and you want one operator action to
      # silence both the dashboard banner and the alert:
      #   expr: rally_task_success == 0 and rally_data_valid == 1 unless on() rally_maintenance_mode == 1
      - alert: RallyTestFailure
        expr: rally_task_success == 0 and rally_data_valid == 1
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally test failed: {{ $labels.service }}/{{ $labels.scenario }}"
          description: |
            The Rally scenario {{ $labels.scenario }} for service
            {{ $labels.service }} has failed. This may indicate an issue
            with the OpenStack cloud.

      # -----------------------------------------------------------------------
      # SERVICE DOWN - Critical: entire service is failing
      # -----------------------------------------------------------------------
      # Maintenance inhibition (opt-in): suppress while a maintenance-type
      # announcement is active. on() matches the unlabeled rally_maintenance_mode
      # against this rule's label set. Enable to silence expected service-wide
      # failures during planned maintenance windows:
      #   expr: rally_service_status == 0 and rally_data_valid == 1 unless on() rally_maintenance_mode == 1
      - alert: RallyServiceDown
        expr: rally_service_status == 0 and rally_data_valid == 1
        for: 10m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "OpenStack service failing Rally tests: {{ $labels.service }}"
          description: |
            All Rally tests for the {{ $labels.service }} service are failing.
            This likely indicates a service outage or major degradation.

      # -----------------------------------------------------------------------
      # SLA BREACH - Warning: SLA criteria not met
      # -----------------------------------------------------------------------
      # Maintenance inhibition (opt-in): suppress while a maintenance-type
      # announcement is active. on() matches the unlabeled rally_maintenance_mode
      # against this rule's label set. Enable to avoid SLA-breach noise from
      # degraded performance during planned maintenance:
      #   expr: rally_task_sla_passed == 0 and rally_data_valid == 1 unless on() rally_maintenance_mode == 1
      - alert: RallySLABreach
        expr: rally_task_sla_passed == 0 and rally_data_valid == 1
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally SLA breach: {{ $labels.service }}/{{ $labels.scenario }}"
          description: |
            The SLA criteria for {{ $labels.scenario }} ({{ $labels.service }})
            have not been met. Check for performance degradation.

  - name: rally_data
    rules:
      # -----------------------------------------------------------------------
      # DATA INVALID - Warning: exporter has no valid result data
      # Fires when rally_data_valid is 0, meaning the summary file is missing,
      # corrupt, or still at its initial "waiting_for_first_run" seed value.
      # -----------------------------------------------------------------------
      - alert: RallyDataInvalid
        expr: rally_data_valid == 0
        for: 30m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally exporter has no valid test result data"
          description: |
            The rally_data_valid metric has been 0 for over 30 minutes,
            meaning the exporter cannot read a valid latest_summary.json.
            The file may be missing, corrupt, or awaiting the first test run.
            Check container logs: docker logs rally-monitor

  - name: rally_staleness
    rules:
      # -----------------------------------------------------------------------
      # STALE RESULTS - Warning: tests haven't run recently
      # -----------------------------------------------------------------------
      - alert: RallyStaleResults
        expr: (time() - rally_last_run_timestamp) > 7200
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Rally test results are stale"
          description: |
            No Rally test results have been produced in over 2 hours.
            The test runner may be stuck or the container may have issues.
            Last run: {{ $value | humanizeDuration }} ago.

      # -----------------------------------------------------------------------
      # OVERALL HEALTH - Critical: everything is failing
      # -----------------------------------------------------------------------
      - alert: RallyOverallFailure
        expr: rally_overall_success == 0 and rally_data_valid == 1
        for: 15m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Rally overall health check failing"
          description: |
            One or more OpenStack services are failing Rally tests.
            Investigate immediately to determine the scope of the issue.

  - name: rally_api
    rules:
      # -----------------------------------------------------------------------
      # API DOWN - Critical: a service's lightweight health check reports down
      # Sourced from health.json (rally_api_up), which refreshes every
      # HEALTH_CHECK_INTERVAL (default 15m) — far faster than the ~4h Rally
      # test cadence. for: 20m requires two consecutive missed checks before
      # firing, so a single transient failure does not page.
      # -----------------------------------------------------------------------
      - alert: RallyApiDown
        expr: rally_api_up == 0
        for: 20m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "OpenStack API health check failing: {{ $labels.service }}"
          description: |
            The lightweight API health check for {{ $labels.service }} has
            reported down for over 20 minutes (two consecutive 15-minute
            checks). This is the fastest available outage signal — investigate
            the service endpoint before waiting on the next Rally run.
          runbook: "docker exec rally-monitor tail -f /rally/logs/health-check.log"
