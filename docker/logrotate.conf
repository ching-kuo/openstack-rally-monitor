/rally/logs/rally-tests.log /rally/logs/health-check.log {
    size 10M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    # /rally/logs is rally-writable: rotate as rally so the copy/truncate/
    # compress steps cannot be redirected through a symlink rally planted
    # there onto a root-owned file.
    su rally root
}
